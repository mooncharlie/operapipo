# ─────────────────────────────────────────────
#  Réglages du site — modifie les valeurs entre guillemets
# ─────────────────────────────────────────────
logo: "/images/logo.png"
title: "Opéra pipo"
description: ""
adresse: "83 avenue Alfred Borriglione, Nice, France 06100"
email: "operapipo@gmail.com"
instagram: "opera__pipo"        # sans le @
horaires: "Ouvert sur rendez-vous"

# Si le site est à l'adresse https://pseudo.github.io/nom-du-depot/
# mets baseurl: "/nom-du-depot". Sinon (nom de domaine perso ou
# dépôt pseudo.github.io), laisse vide.
baseurl: ""

# ── Ne pas toucher en dessous ────────────────
lang: fr
collections:
  expos:
    output: true
    permalink: /:name/
defaults:
  - scope:
      path: ""
      type: expos
    values:
      layout: expo
  - scope:
      path: "a-propos.md"
    values:
      layout: page
      permalink: /a-propos/
mois: [janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre]
exclude: [README.md, GUIDE.md]
future: true
