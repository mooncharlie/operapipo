# ── Ne pas toucher en dessous ────────────────
lang: en
collections:
  expos:
    output: true
    permalink: /:name/
defaults:
  - scope:
      path: ""
      type: expos
    values:
      layout: expo
  - scope:
      path: "about.md"
    values:
      layout: page
      permalink: /about/
mois: [January, February, March, April, May, June, July, August, September, October, November, December]
exclude: [README.md, GUIDE.md]
future: true
