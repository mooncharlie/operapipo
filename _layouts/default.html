<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.titre %}{{ page.titre }}, {{ page.artiste }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.titre %}{{ page.artiste }}, {{ page.titre }}{% else %}{{ site.description }}{% endif %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/images/logo.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/logo.png' | relative_url }}">
</head>
<body>
  <header class="entete">
    <a class="nom" href="{{ '/' | relative_url }}">
      {%- if site.logo and site.logo != "" -%}
        <img class="logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
      {%- else -%}
        {{ site.title }}
      {%- endif -%}
    </a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="pied">
    <p class="coordonnees">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <span>{{ site.adresse }}</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <a href="https://www.instagram.com/{{ site.instagram }}">@{{ site.instagram }}</a>
    </p>
    <p>{{ site.horaires }}</p>
  </footer>
</body>
</html>
